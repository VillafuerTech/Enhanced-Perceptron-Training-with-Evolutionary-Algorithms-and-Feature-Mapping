name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run Ruff
        run: ruff check .

      - name: Run Black
        run: black --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run tests with coverage
        if: matrix.python-version == '3.11'
        run: |
          pytest --cov=perceptron_benchmark --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  smoke-test:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Generate datasets
        run: python scripts/make_datasets.py --n-samples 50

      - name: Run benchmark (sequential)
        run: |
          python -m perceptron_benchmark.run \
            --dataset linear \
            --optimizer sequential \
            --epochs 20 \
            --seed 42 \
            --save

      - name: Run benchmark (GA)
        run: |
          python -m perceptron_benchmark.run \
            --dataset xor \
            --optimizer ga \
            --generations 10 \
            --pop 50 \
            --seed 42 \
            --save

      - name: Verify outputs exist
        run: |
          test -f reports/results.csv
          ls -la reports/runs/
